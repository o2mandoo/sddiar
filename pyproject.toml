[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sddiar"
version = "0.5.0"
description = "Offline CPU speaker diarization library, runtime adapters, and safety contracts"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
runtime = [
  "numpy>=1.24",
  "onnxruntime>=1.29,<1.30",
  "kaldi-native-fbank>=1.22.3,<1.23",
]

[project.scripts]
sddiar = "sddiar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
